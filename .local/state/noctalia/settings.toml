config_version = 8

[backdrop]
enabled = true
tint_intensity = 0.54999998770654202

[bar.default]
background_opacity = 0.0
capsule = true
center = [ "workspaces", "bar" ]
end = [ "group:g2", "spacer_2", "tray", "group:g3", "spacer_2", "notes", "notifications", "battery", "control-center" ]
margin_ends = 0
padding = 12
shadow = false
start = [ "launcher", "clock", "group:g1", "privacy", "spacer_2", "active_window" ]
widget_spacing = 5

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "temp", "ram" ]
    opacity = 0.5
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "media", "audio_visualizer", "volume" ]
    opacity = 0.5
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "network", "bluetooth" ]
    opacity = 0.5
    padding = 6.0

[battery]
